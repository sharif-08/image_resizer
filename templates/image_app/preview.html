{% extends 'base.html' %}

{% block content %}
<div class="preview-container">
    <div class="row justify-content-center align-items-center h-100 g-0">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Processed Image</h3>
                <a href="{% url 'image_app:home' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
            <div class="d-flex flex-column align-items-center">
                <img src="{{ processed.processed_image.url }}" alt="Processed Image" class="img-fluid">
                <div class="image-info w-100 mt-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1"><strong>DPI:</strong> {{ processed.dpi }}</p>
                            <p class="mb-1"><strong>File Size:</strong> {{ processed_size|filesizeformat }}</p>
                            <p class="mb-1"><strong>Background Removed:</strong> {{ processed.remove_background|yesno:"Yes,No" }}</p>
                        </div>
                        <a href="{% url 'image_app:download_image' processed.id %}" class="btn btn-primary">
                            <i class="bi bi-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
