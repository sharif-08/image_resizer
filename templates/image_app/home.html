{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Image Processor</h5>
                </div>
                <div class="card-body">
                    <form action="{% url 'image_app:process_image' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="image" class="form-label">Select Image</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="width" class="form-label">Width</label>
                                <input type="number" class="form-control" id="width" name="width" value="35" step="0.01">
                            </div>
                            <div class="col-md-6">
                                <label for="height" class="form-label">Height</label>
                                <input type="number" class="form-control" id="height" name="height" value="45" step="0.01">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="unit" class="form-label">Unit</label>
                                <select class="form-select" id="unit" name="unit">
                                    <option value="mm">mm</option>
                                    <option value="px">Pixels</option>
                                    
                                    <option value="cm">Centimeters</option>
                                    <option value="in">Inches</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="dpi" class="form-label">DPI</label>
                                <input type="number" class="form-control" id="dpi" name="dpi" value="300" min="72" max="1200">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="target_size" class="form-label">Target File Size (KB)</label>
                            <input type="number" class="form-control" id="target_size" name="target_size" value="140" min="101" max="10000">
                            <div class="form-text">Leave empty for original quality</div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remove_background" name="remove_background" value="true">
                            <label class="form-check-label" for="remove_background">Remove Background</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Process Image</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Preview image before upload
    document.getElementById('image').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const widthInput = document.getElementById('width');
                    const heightInput = document.getElementById('height');
                    const unitSelect = document.getElementById('unit');
                    
                    // Only update dimensions if the user hasn't entered values
                    if (!widthInput.value || widthInput.value === '35') {
                        widthInput.value = this.width;
                    }
                    if (!heightInput.value || heightInput.value === '45') {
                        heightInput.value = this.height;
                    }
                    
                    // Only update unit if dimensions were updated
                    if ((!widthInput.value || widthInput.value === '35') && (!heightInput.value || heightInput.value === '45')) {
                        unitSelect.value = 'px';
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });
</script>
{% endblock %}
